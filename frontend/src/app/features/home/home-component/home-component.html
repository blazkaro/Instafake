<div class="container">
    <div class="nav">
        <div class="logo">
            Instafake
        </div>
        <div class="search-bar">
            <!-- for some reason, [rows]="1" doesnt work but anything > 1 does. The lesser the value the lesser additional height when adding scrollbar-->
            <tui-textfield iconStart="@tui.search" tuiTextfieldSize="m" multi [rows]="1.00001">
                <input placeholder="Search by @username and/or #tags" tuiInputChip [(ngModel)]="searchInput"
                    [unique]="true" [separator]="' '" (ngModelChange)="onSearchInputChange($event)">
                <tui-input-chip *tuiItem></tui-input-chip>
            </tui-textfield>
        </div>
        <div class="my-profile" tuiDropdownHover [tuiDropdown]="dropdown">
            <div class="avatar" size="l" tuiAvatar tuiAvatarOutline="var(--tui-background-accent-2)">
                <img src="{{userService.user()?.avatarUrl}}" alt="{{userService.user()?.userName}}">
            </div>
        </div>
    </div>
    <div class="posts-container">
        <div class="posts">
            @for (post of posts(); track post.id) {
            <app-post-component [post]="post" class="post"></app-post-component>
            }
        </div>

        <div #sentinel class="sentinel"></div>

        @if(postsResource.isLoading()){
        <tui-loader></tui-loader>
        }
    </div>
</div>

<ng-template #dropdown>
    <div tuiGroup>
        <button tuiIconButton iconStart="@tui.image-plus" size="s" appearance="secondary-grayscale" (click)="openPostCreator();"></button>
        <button tuiIconButton iconStart="@tui.settings" size="s" appearance="secondary-grayscale"></button>
        <button tuiIconButton iconStart="@tui.log-out" size="s" appearance="secondary-grayscale"></button>
    </div>
</ng-template>
