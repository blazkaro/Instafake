<div class="container">
    <tui-elastic-container>
        <section class="slider">
            <section tuiSlides class="slides">
                <img src="{{post.multimediaUrls[multimedia_index]}}">
            </section>
        </section>
    </tui-elastic-container>

    <div tuiGroup class="stepper">
        <button tuiIconButton appearance="secondary" iconStart="@tui.chevron-left" size="m" type="button"
            [disabled]="multimedia_index === 0" (click)="multimedia_index -= 1"></button>

        <button tuiIconButton appearance="secondary" iconStart="@tui.chevron-right" size="m" type="button"
            [disabled]="multimedia_index === post.multimediaUrls.length - 1" (click)="multimedia_index += 1"></button>
    </div>

    <div class="post-about">
        <div class="created-at">
            {{post.createdAt | date: 'medium'}}
        </div>
        <div class="post-description-actions-wrapper">
            <div class="description">
                <tui-avatar-labeled label="{{post.author.name}}">
                    <div tuiAvatar size="xs">
                        <img src="{{post.author.avatarUrl}}">
                    </div>
                </tui-avatar-labeled>
                <span>
                    {{post.description}}
                </span>
                <div class="tags">
                    @for (tag of post.tags; track tag) {
                    #{{tag}}
                    }
                </div>
            </div>
            <div class="actions">
                <div class="actions">
                    <button tuiButton appearance="action-destructive" class="action" size="xs" (click)="toggleLike()">
                        <tui-icon [icon]="post.likedByUser ? '@tui.heart-filled' : '@tui.heart'"></tui-icon>
                        <div>{{post.likesCount | compactNumber}}</div>
                    </button>
                    <button tuiButton appearance="action" type="button" class="action" size="xs">
                        <tui-icon icon="@tui.messages-square"></tui-icon>
                        <div>{{post.commentsCount | compactNumber}}</div>
                    </button>
                    <button tuiIconButton appearance="action-grayscale" type="button" class="action" size="xs">
                        <tui-icon icon="@tui.link"></tui-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
